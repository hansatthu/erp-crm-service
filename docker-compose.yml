version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geta-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  ngrok:
    image: ngrok/ngrok:latest
    container_name: geta-ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "backend:3000"
      - "--domain=morphine-tidings-delicate.ngrok-free.dev"
    depends_on:
      - backend
